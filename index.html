<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>FIDIT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <script src="./script.js" defer></script>
    <div id="prijava" class="container">
        <img src="./assets/FIDIT-logo.svg" alt="LOGO">
        <h2>Prijavite se</h2>
        <form onsubmit="validateLogin(event)">
            <label for="korisnicko-ime">
                Korisničko ime: 
                <input type="text" name="korisnicko ime" id="korisnicko-ime">
            </label>
            <label for="lozinka">
                Lozinka: 
                <input type="text" name="lozinka" id="lozinka">
            </label>
            <input type="submit" value="Prijava"></input>
        </form>
    </div>
</body>
</html>
